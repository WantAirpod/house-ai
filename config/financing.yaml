decision_rules:
  - "기본 목표 매매가는 9.9억원이다."
  - "10억원은 은행 스트레스 DSR 사전심사 통과 시에만 허용한다."
  - "10.1억원 이상은 추가 현금 3천만~5천만원 또는 확정 대출승인 없이는 제외한다."
  - "내부 스트레스 DSR 39% 미만은 안정형, 39~40%는 경계형, 40% 초과는 제외한다."
  - "카드론, 현금서비스, 리볼빙으로 계약금·잔금·보증금 반환 지연을 충당하지 않는다."
  - "카드 결제한 취득세·중개보수·법무비는 신용대출 필요액에서 제외하되 카드 월 납입에는 포함한다."
  - "실제 주담대는 희망액, 담보평가액×LTV, 정책상한, DSR 심사액 중 최솟값으로 확정한다."

